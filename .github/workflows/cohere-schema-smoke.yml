name: cohere-schema-smoke

# A fixed synthetic capability probe. Raw replies and diagnostics are always sealed.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'unique capability-probe label'
        required: true
        default: cohere-schema-smoke-20261025
      scope:
        description: 'small expression capability probe or complete teacher transport'
        type: choice
        options: [expressions, teacher]
        default: expressions
      input_sha256:
        description: 'registered input digest, required for the full teacher scope'
        default: ''
      representation:
        description: 'teacher transport, used only for scope=teacher'
        type: choice
        options: [json, json-v2]
        default: json

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROBE_LABEL: ${{ inputs.label }}
      PROBE_SCOPE: ${{ inputs.scope }}
      PROBE_INPUT_SHA256: ${{ inputs.input_sha256 }}
      PROBE_REPRESENTATION: ${{ inputs.representation }}
    steps:
      - uses: actions/checkout@v4
      - name: validate the registered request
        run: |
          [[ "$PROBE_LABEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$PROBE_SCOPE" == expressions || "$PROBE_SCOPE" == teacher ]]
          if [ "$PROBE_SCOPE" = teacher ]; then [[ "$PROBE_INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]]; fi
      - name: full teacher schema dependencies and original primer
        if: inputs.scope == 'teacher'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --break-system-packages -r t/recipes/requirements-cohere-json.txt
          gh release download eval-inputs -p teacher-primer.md -D out/schema-inputs
      - name: registered synthetic capability requests
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: |
          umask 077
          mkdir -p out/schema-smoke
          if [ "$PROBE_SCOPE" = teacher ]; then
            python3 t/recipes/cohere_json_smoke.py --out out/schema-smoke/results \
              --primer out/schema-inputs/teacher-primer.md --input-sha256 "$PROBE_INPUT_SHA256" \
              --representation "$PROBE_REPRESENTATION" \
              > out/schema-smoke/run.log 2>&1
          else
            python3 t/recipes/cohere_schema_smoke.py --out out/schema-smoke/results \
              > out/schema-smoke/run.log 2>&1
          fi
      - name: aggregate reading and sealed evidence
        if: always()
        run: |
          if [ ! -d out/schema-smoke ]; then exit 0; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('out/schema-smoke/results/summary.json')
          if path.exists():
              report = json.loads(path.read_text())
              print(json.dumps({k: report[k] for k in
                    ('model', 'recorded_cost_usd', 'unresolved_billing_or_transport',
                     'all_conditions_hold', 'cases')}))
          PY
          umask 077
          mkdir -p /tmp/sealed
          tar -czf /tmp/schema-smoke.tar.gz out/schema-smoke
          key=$(mktemp)
          trap 'rm -f "$key" /tmp/schema-smoke.tar.gz' EXIT
          openssl rand -hex 32 > "$key"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in /tmp/schema-smoke.tar.gz \
            -out /tmp/sealed/outputs.tar.gz.enc -pass "file:$key"
          openssl pkeyutl -encrypt -pubin -inkey .github/teacher-outputs.pub.pem -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 -in "$key" -out /tmp/sealed/key.enc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-${{ env.PROBE_LABEL }}
          path: /tmp/sealed
          retention-days: 30
