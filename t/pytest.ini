[pytest]
# Plain-python tests here name their registration decorator `test` (see
# test_conformance.py and its siblings): `def test(fn): UNIT_TESTS.append(fn)`.
# pytest's own default python_functions is the single prefix "test", which
# matches that name too (a bare "test" starts with "test"), so pytest tries
# to collect the decorator itself as a test and errors on its `fn` argument.
# Requiring the underscore keeps every real test_* function while dropping
# that one false match.
python_functions = test_*
